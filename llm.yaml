call_sites:
  china-relevance:
    max_tokens: 262144
    temperature: 0.7
    timeout: 120
  column-classify:
    max_tokens: 2048
    temperature: 0.7
    timeout: 60
  column-score:
    max_tokens: 262144
    temperature: 0.0
    timeout: 120
  event-dedup:
    max_tokens: 4096
    temperature: 0.0
    timeout: 120
  summarize:
    max_tokens: 512
    temperature: 0.7
    timeout: 180
  monthly-overview:
    max_tokens: 1200
    temperature: 0.7
    timeout: 30
model: qwen3.8-flash-next-iq3_s
provider: strata
providers:
  # Strata 引擎 + Qwen3.8-Flash-Next IQ3_S @ 8080（Windows 原生; bash start-llm.sh 启动, 见 ADR-0005）
  # 思维链: 引擎默认开 CoT, 客户端 reasoning_effort=none 实测有效关闭（2026-10-12 冒烟, HTTP 200 + 无
  #   reasoning_content）。此键不可去 —— 默认 CoT 下小 max_tokens 会被思维链吃满预算致 content=null
  #   （max_tokens=32 实测 null）。速度参照 76-136 tok/s; 加载后显存 15.7/16.3GB, 与一切 GPU 负载互斥
  strata:
    api_key_env: STRATA_API_KEY
    base_url: http://127.0.0.1:8080/v1
    max_output_tokens: 16384
    reasoning: "off"
  minimax:
    api_key_env: MINIMAX_API_KEY
    base_url: https://api.minimax.chat/v1
  zhipu:
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4/
